name: CI

# `npm run check` split into parallel jobs (docs/deployment.md#ci). The aggregate job keeps the
# name `check`, which branch protection requires; it fails unless every part passed.

on:
  pull_request:
  push:
    branches: [dev, stage, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, markdown links and module boundary rules.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:links
      - run: npm run lint:boundaries

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            projects: --project unit
          - name: db
            projects: --project db
          - name: design
            projects: --project design
            browser: true
          - name: e2e
            projects: --project e2e --project e2e-browser
            browser: true
    name: tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # The db and e2e projects start postgres:17-alpine through Testcontainers; pull it while npm installs.
      - if: matrix.name == 'db' || matrix.name == 'e2e'
        run: docker pull -q postgres:17-alpine &
      - run: npm ci
      # Chromium for the design engine (Playwright), cached by Playwright version; system libraries every time.
      - if: matrix.browser
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: matrix.browser && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: matrix.browser && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx vitest run ${{ matrix.projects }}
      # The end-to-end report (WhatsApp transcript, rendered images, publishing log), pass or fail.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.name == 'e2e'
        with:
          name: e2e-report
          path: reports/e2e/
          if-no-files-found: ignore

  # The required status check: passes only when every job above passed.
  check:
    if: always()
    needs: [static, tests]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.static.result }}" = success && test "${{ needs.tests.result }}" = success
