name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Typecheck, module boundary rules, and all tests.
      - run: npm run check
      # The end-to-end report (WhatsApp transcript, rendered images, publishing log), pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/e2e/
          if-no-files-found: ignore
