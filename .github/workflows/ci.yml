name: CI

# `npm run check` split into parallel jobs (docs/deployment.md#ci). The aggregate job keeps the
# name `check`, which branch protection requires; it fails unless every part passed. On a push to
# `dev`, `stage` or `main` this workflow runs inside Deploy (`workflow_call`), which deploys only
# after it passed for that commit.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR cancels the older run. Inside Deploy every run is its own group (the run
# id), so a push's CI is never cancelled by the next push and each commit gets a verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is this PR in the docs-only lane (scripts/lane.ts, docs/implementation-plan.md#change-size-lanes)? Then
  # the test jobs are skipped. Outside a PR (inside Deploy) nothing is docs-only and every job runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - id: lane
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then echo docs_only=false >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/lane.ts --base "${{ github.event.pull_request.base.sha }}" --github-output "$GITHUB_OUTPUT"

  # Typecheck, conflict markers, markdown links, module boundary rules, the review-queue files and the
  # migration snapshot chain. Always runs.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:conflicts
      - run: npm run lint:links
      - run: npm run lint:boundaries
      - run: npm run lint:review-queue
      # The migration snapshot chain (implementation-plan.md, Lanes, "Migrations: one in flight").
      - run: npm run db:check

  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            projects: --project unit
          - name: db
            projects: --project db
          - name: design
            projects: --project design
            browser: true
          - name: e2e
            projects: --project e2e --project e2e-browser
            browser: true
    name: tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # The db and e2e projects start postgres:17-alpine through Testcontainers; pull it while npm installs.
      - if: matrix.name == 'db' || matrix.name == 'e2e'
        run: docker pull -q postgres:17-alpine &
      - run: npm ci
      # Chromium for the design engine (Playwright), cached by Playwright version. On a cache hit the
      # apt step is skipped (it can take minutes): the ubuntu-latest image already has Chromium's
      # system libraries, and a missing one fails the browser tests, not hides them.
      - if: matrix.browser
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: matrix.browser && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npx vitest run ${{ matrix.projects }}
      # The end-to-end report (WhatsApp transcript, rendered images, publishing log), pass or fail.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.name == 'e2e'
        with:
          name: e2e-report
          path: reports/e2e/
          if-no-files-found: ignore

  # The required status check: passes only when changes and static passed and the tests passed, or were
  # skipped because changes said docs-only. Tests skipped for any other reason (changes failed, the run was
  # cancelled) fail it, so a PR can never skip its tests into a pass.
  check:
    if: always()
    needs: [changes, static, tests]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.static.result }}" = success
          test "${{ needs.tests.result }}" = success || { test "${{ needs.tests.result }}" = skipped && test "${{ needs.changes.outputs.docs_only }}" = true; }
