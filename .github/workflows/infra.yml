name: Infra

# Builds the production image and checks the Terraform on pushes to dev, stage and main, and on PRs
# that touch them (the image: anything but docs and infra/; the Terraform: infra/). It never pushes an
# image, never authenticates to Google Cloud and never plans or applies (docs/deployment.md). On a
# push it runs inside Deploy (`workflow_call`), which deploys only after it passed for that commit.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# As in ci.yml: PR runs cancel older ones; a push's run (inside Deploy) is never cancelled.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo image=true >> "$GITHUB_OUTPUT"; echo terraform=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          echo "$files"
          echo "image=$(echo "$files" | grep -qvE '^(infra/|docs/|[^/]+\.md$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "terraform=$(echo "$files" | grep -qE '^(infra/|\.github/workflows/infra\.yml$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: postly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the dev sandbox image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: postly-sandbox:ci
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Image runs as non-root and holds no test or playground code
        run: |
          test "$(docker run --rm --entrypoint id postly:ci -u)" != "0"
          ! docker run --rm --entrypoint sh postly:ci -c 'find dist -name "*.test.*" -o -name playground | grep -q .'
          ! docker run --rm --entrypoint sh postly:ci -c 'test -d node_modules/vitest'
      - name: Local stack on the simulators (migrate, web, worker)
        run: |
          docker compose -p ci up -d
          for i in $(seq 1 40); do curl -fsS localhost:8080/healthz && break; sleep 3; done
          curl -fsS localhost:8080/healthz
          docker compose -p ci exec -T postgres psql -U postgres -d postly -tAc "select policy from pgboss.queue where name = 'weekly-update-tick'" | grep -qx singleton
        env:
          COMPOSE_BAKE: "false"
      - name: Stack logs
        if: always()
        run: docker compose -p ci logs --no-color || true

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [environments/dev, environments/stage, environments/prod, bootstrap]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.x
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=infra/${{ matrix.root }} validate

  # One stable name to require in branch protection: passes only when `changes` passed and the image and
  # Terraform jobs passed or were skipped by the path filter. A failed or cancelled job fails it, and a
  # broken infra.yml produces no `infra-check` at all, which blocks the merge instead of passing silently.
  infra-check:
    if: always()
    needs: [changes, image, terraform]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.changes.result }}" = success
          case "${{ needs.image.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.terraform.result }}" in success|skipped) ;; *) exit 1 ;; esac
