name: Infra

# Checks the images and the Terraform on PRs that touch them (the image: anything but docs, infra/
# and top-level Markdown; the Terraform: infra/), and the Terraform on pushes to dev, stage and main
# (inside Deploy, `workflow_call`, which deploys only after it passed for that commit). It never
# pushes an image, never authenticates to Google Cloud and never plans or applies (docs/deployment.md).
# On a push Deploy passes `image: false`: its own `image` job builds the image once, runs the same
# checks (scripts/check-image.sh) on it, and pushes it, so a push run builds it once, not twice.

on:
  pull_request:
  workflow_call:
    inputs:
      image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # One Dockerfile, two targets. The gha cache scopes are the ones Deploy's image job writes on
      # dev, so a PR to dev starts from dev's last build (a PR's own cache is readable only by that PR).
      - name: Build the image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          provenance: false
          tags: postly:ci
          cache-from: |
            type=gha,scope=postly
            type=gha,scope=postly-sandbox
          cache-to: type=gha,mode=max,scope=postly
      - name: Build the dev sandbox image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: sandbox
          push: false
          provenance: false
          tags: postly-sandbox:ci
          cache-from: |
            type=gha,scope=postly-sandbox
            type=gha,scope=postly
          cache-to: type=gha,mode=max,scope=postly-sandbox
      - name: Image checks (non-root, no test or playground code, local stack on the simulators)
        run: scripts/check-image.sh postly:ci
        env:
          COMPOSE_BAKE: "false"

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [environments/dev, environments/stage, environments/prod, bootstrap]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.x
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=infra/${{ matrix.root }} validate
